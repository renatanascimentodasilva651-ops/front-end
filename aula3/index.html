<!DOCTYPE html>
<html lang="pt-br">
 <head>
    <title>Recrutamento Online</title>
    <meta charset="UTF-8">
 </head>
 <body>
   <header>
     <h1>Recrutamento Online</h1>
   </header>
   <main>
     <section>
        <h2>Cadastre seu curriculo</h2>
        <form action="#" method="get">
            <p>Preencha o formulário para se candidatar à vaga</p>
            <fieldset>
                <legend>Dados Pessoais</legend>
                <div>
                    <label for="nome_id">Nome completo:</label>
                    <input id="nome_id" name="nome" type="text" required>
                </div>
                <div>
                    <label for="telefone_id">Telefone:</label>
                    <input id="telefone_id" name="telefone" type="tel">
                    <div>
                        <label for="email_id">Email:</label>
                        <input id="email_id" name="email" type="email">
                    </div>
                </div>
            </fieldset>
        </form>
     </section>
   </main>
   <footer>

   </footer>
 </body>
</html>
